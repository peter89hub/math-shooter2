<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 캐시 방지 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>Math Shooter: v7.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            user-select: none;
        }
        canvas { display: block; }
        
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }
        
        .hud-text {
            font-size: 1.5rem; font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
        }
        
        .control-btn {
            font-size: 1.5rem; background: rgba(0, 0, 0, 0.6);
            border-radius: 50%; border: 2px solid #aaa;
            width: 50px; height: 50px;
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.1s; pointer-events: auto; cursor: pointer;
            margin-bottom: 10px;
        }
        .control-btn:active { transform: scale(0.9); }

        #start-screen, #game-over-screen, #pause-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; 
            pointer-events: auto; backdrop-filter: blur(5px);
        }
        
        #pause-screen { background: rgba(0, 0, 0, 0.6); display: none; }

        #clear-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; 
            flex-direction: column; justify-content: center; align-items: center;
            pointer-events: auto; 
            background: rgba(0, 0, 0, 0.3);
            z-index: 100; 
        }

        #clearTitle, #clearDesc, #clearTime {
            text-shadow: 0 0 20px black, 0 0 10px black;
        }

        .btn {
            background: linear-gradient(45deg, #00f260, #0575e6);
            border: none; padding: 15px 40px; color: white;
            font-size: 1.2rem; border-radius: 15px; cursor: pointer; margin: 12px;
            box-shadow: 0 0 20px rgba(0, 242, 96, 0.4);
            transition: transform 0.1s; 
            text-transform: uppercase; font-weight: 800;
            width: 320px; text-align: center;
        }
        .btn:active { transform: scale(0.95); }
        .btn-sub {
            display: block; font-size: 0.8rem; font-weight: normal; 
            color: rgba(255,255,255,0.9); margin-top: 5px;
        }
        .hidden { display: none !important; }

        #version-stamp {
            position: absolute; bottom: 10px; left: 10px;
            font-size: 0.8rem; color: #55ff55; 
            z-index: 9999; 
        }
        
        #audio-status {
            position: absolute; bottom: 30px; left: 10px;
            font-size: 0.8rem; color: #aaa; z-index: 9999;
        }
        
        #countdown-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none; z-index: 20;
        }
        .countdown-number {
            font-size: 15rem; font-weight: 900; color: #fff;
            text-shadow: 0 0 50px rgba(0,255,255,1);
            animation: popIn 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="version-stamp">v7.0 : Hybrid Audio</div>
    <div id="audio-status">Audio: Ready</div>

    <!-- 1순위: 파일 재생 -->
    <audio id="bgmFile" loop preload="auto">
        <source src="./bgm.m4a" type="audio/mp4">
        <source src="./bgm.mp3" type="audio/mpeg">
    </audio>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="flex justify-between w-full max-w-4xl mx-auto items-start">
            <div class="hud-text text-left">
                <div style="color: #00ffff;">TARGET: <span id="targetEl">10</span></div>
                <div style="color: #ffeb3b; margin-top: 5px;">CURRENT: <span id="currentEl">0</span></div>
                <div style="color: #ff5555; margin-top: 5px; font-size: 1.2rem;">
                    MISSED: <span id="leakageEl">0</span> / <span id="limitEl">300</span>
                </div>
            </div>
            
            <div class="flex flex-col items-end">
                <div class="flex gap-2">
                    <div id="pause-btn" class="control-btn" onclick="togglePause()">⏸️</div>
                    <div id="sound-control" class="control-btn" onclick="toggleSound()">🔇</div>
                </div>
                
                <div class="hud-text text-right mt-2">
                    <div style="color: #ff0055;">HP: <span id="hpEl">100</span>%</div>
                    <div style="font-size: 1rem; color: #aaa; margin-top: 5px;">
                        LEVEL <span id="levelEl">1 / 10</span>
                        <span id="modeDisplay" style="font-size: 0.8rem; display:block; color:#00f260;"></span>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="message-area" class="text-center text-5xl font-black text-white drop-shadow-lg opacity-0 transition-opacity duration-300 transform scale-150"></div>
        <div id="countdown-overlay"></div>
    </div>

    <!-- 스크린들 -->
    <div id="start-screen">
        <h1 class="text-6xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-red-600 filter drop-shadow-lg text-center">
            MATH SHOOTER
        </h1>
        <p class="text-gray-300 mb-8 text-center text-sm">v7.0 | 소리가 안 나면 기계음으로 자동 전환됩니다.</p>
        
        <button class="btn" onclick="startGame('easy')">
            워밍업
            <span class="btn-sub">Limit 300 | Random Joker</span>
        </button>
        <button class="btn" style="background: linear-gradient(45deg, #0575e6, #00f260);" onclick="startGame('normal')">
            실전
            <span class="btn-sub">Limit 200 | Random Joker</span>
        </button>
        <button class="btn" style="background: linear-gradient(45deg, #ff0055, #ffcc00);" onclick="startGame('hard')">
            몰입
            <span class="btn-sub">Limit 100 | Random Joker</span>
        </button>
    </div>

    <div id="game-over-screen" class="hidden">
        <h2 class="text-5xl font-black text-red-500 mb-2 drop-shadow-lg">GAME OVER</h2>
        <p id="fail-reason" class="text-xl text-gray-300 mb-4">HP 고갈</p>
        <p class="text-2xl text-white mb-6">최종 레벨: <span id="finalLevel">1</span> / 10</p>
        <button class="btn" id="restartBtn">다시 도전</button>
    </div>

    <div id="pause-screen">
        <h2 class="text-5xl font-black text-white mb-6">PAUSED</h2>
        <button class="btn" onclick="togglePause()">계속하기</button>
    </div>

    <div id="clear-screen">
        <h2 id="clearTitle" class="text-6xl font-black mb-2 drop-shadow-lg text-center">CONGRATULATIONS!</h2>
        <p id="clearTime" class="text-4xl font-bold text-yellow-300 mb-4 drop-shadow-md">TOTAL TIME: 000s</p>
        <p id="clearDesc" class="text-xl text-white mb-8 text-center px-4 leading-relaxed">...</p>
        <button class="btn" id="finalRestartBtn">처음으로 돌아가기</button>
    </div>

    <script>
        // ---------------- 하이브리드 오디오 시스템 (v7.0) ----------------
        const bgmFile = document.getElementById('bgmFile');
        const statusEl = document.getElementById('audio-status');
        let useSynth = false; // 파일 실패 시 true로 변경
        let isSoundOn = false;
        
        // Synth 관련 변수
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let masterGain;
        let bgmInterval = null;
        let beatCount = 0;

        // 1. 파일 로딩 에러 감지 -> Synth 모드로 자동 전환
        bgmFile.addEventListener('error', function(e) {
            console.warn("오디오 파일 로드 실패. 신디사이저 모드로 전환합니다.");
            useSynth = true;
            statusEl.innerText = "Audio: Synth Mode (File missing)";
        }, true); // 캡처링 단계에서 에러 포착

        // 2. 파일 재생 시도 및 실패 처리
        async function tryPlayFile() {
            try {
                bgmFile.volume = 0.5;
                await bgmFile.play();
                statusEl.innerText = "Audio: File Playing";
            } catch (err) {
                console.log("파일 재생 불가 (권한/경로 문제). Synth로 전환.");
                useSynth = true;
                statusEl.innerText = "Audio: Synth Mode (Auto)";
                startSynthBGM();
            }
        }

        // 3. 신디사이저 BGM (사이버펑크 스타일 튜닝)
        function initSynth() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.3;
                masterGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSynthNote() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            
            // Kick (Square Wave for punch)
            const oscKick = audioCtx.createOscillator();
            const gainKick = audioCtx.createGain();
            oscKick.type = 'square';
            oscKick.frequency.setValueAtTime(100, now);
            oscKick.frequency.exponentialRampToValueAtTime(0.01, now + 0.15);
            gainKick.gain.setValueAtTime(0.6, now);
            gainKick.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            oscKick.connect(gainKick);
            gainKick.connect(masterGain);
            oscKick.start(now);
            oscKick.stop(now + 0.15);

            // Off-beat Bass (Sawtooth)
            if (beatCount % 2 !== 0) {
                const oscBass = audioCtx.createOscillator();
                const gainBass = audioCtx.createGain();
                oscBass.type = 'sawtooth';
                oscBass.frequency.setValueAtTime(65.41, now); // C2
                gainBass.gain.setValueAtTime(0.3, now);
                gainBass.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                oscBass.connect(gainBass);
                gainBass.connect(masterGain);
                oscBass.start(now);
                oscBass.stop(now + 0.2);
            }
            beatCount++;
        }

        function startSynthBGM() {
            initSynth();
            if (bgmInterval) clearInterval(bgmInterval);
            bgmInterval = setInterval(playSynthNote, 250); // 120 BPM
        }

        function stopSynthBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
            if (audioCtx) audioCtx.suspend();
        }

        // 4. 통합 토글 함수
        function toggleSound() {
            isSoundOn = !isSoundOn;
            updateSoundIcon();

            if (isSoundOn) {
                // 켜기
                if (useSynth) {
                    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                    startSynthBGM();
                } else {
                    // 파일 재생 시도. 실패하면 내부에서 useSynth=true 되고 startSynthBGM 호출됨
                    tryPlayFile();
                }
            } else {
                // 끄기
                bgmFile.pause();
                stopSynthBGM();
            }
        }

        function updateSoundIcon() {
            const btn = document.getElementById('sound-control');
            if (isSoundOn) {
                btn.innerText = "🔊";
                btn.style.borderColor = "#00f260";
            } else {
                btn.innerText = "🔇";
                btn.style.borderColor = "#aaa";
            }
        }

        // ------------------ Game Logic ------------------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI
        const targetEl = document.getElementById('targetEl');
        const currentEl = document.getElementById('currentEl');
        const hpEl = document.getElementById('hpEl');
        const levelEl = document.getElementById('levelEl');
        const modeDisplay = document.getElementById('modeDisplay');
        const leakageEl = document.getElementById('leakageEl');
        const limitEl = document.getElementById('limitEl');
        const messageArea = document.getElementById('message-area');
        const countdownOverlay = document.getElementById('countdown-overlay');
        
        // Screens
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const pauseScreen = document.getElementById('pause-screen');
        const clearScreen = document.getElementById('clear-screen');
        const clearTitle = document.getElementById('clearTitle');
        const clearTime = document.getElementById('clearTime');
        const clearDesc = document.getElementById('clearDesc');
        const failReason = document.getElementById('fail-reason');
        const finalLevelEl = document.getElementById('finalLevel');

        // Leakage Limit
        const DIFFICULTY = {
            easy: { name: "워밍업", speed: 0.8, accel: 0.05, limit: 300 },
            normal: { name: "실전", speed: 1.5, accel: 0.1, limit: 200 },
            hard: { name: "몰입", speed: 3.0, accel: 0.2, limit: 100 }
        };

        const FINALE_CONFIG = {
            easy: {
                title: "HEALING COMPLETE",
                desc: "충분합니다.<br>이미 당신의 두뇌는 최고 상태입니다!",
                colorClass: "text-green-400",
                hue: [90, 150]
            },
            normal: {
                title: "EXCELLENT!",
                desc: "최고의 실전을 완료하였습니다.<br>당신의 두뇌는 무엇이든 할 수 있습니다!",
                colorClass: "text-blue-400",
                hue: [200, 260]
            },
            hard: {
                title: "ALL CLEAR!",
                desc: "최고의 두뇌 레벨!<br>당신은 무아지경 속에 있습니다!",
                colorClass: "text-red-500",
                hue: [340, 380]
            }
        };

        // State
        let currentMode = 'normal';
        let gameActive = false;
        let isPaused = false;
        let isLevelClearing = false;
        let timeScale = 1.0;
        let animationId;
        let frames = 0;
        let startTime = 0;
        
        let player, projectiles, numbers, particles, confettiList, stars;
        let currentSum = 0, targetNum = 10, level = 1;
        let leakageSum = 0; 
        
        let keys = { ArrowRight: false, ArrowLeft: false, ArrowUp: false, ArrowDown: false, Space: false };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Player {
            constructor() {
                this.width = 40; this.height = 50;
                this.x = canvas.width/2; this.y = canvas.height - 100;
                this.velocity = {x:0, y:0}; this.speed = 7;
                this.color = '#00ffff'; this.hp = 100; this.radius = 20;
                this.blinkTimer = 0;
            }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y);
                let c = this.color;
                if(this.blinkTimer > 0) {
                    if(Math.floor(this.blinkTimer/5)%2 === 0) c = '#ff0000';
                }
                ctx.beginPath(); ctx.moveTo(0, -this.height/2); ctx.lineTo(this.width/2, this.height/2);
                ctx.lineTo(0, this.height/3); ctx.lineTo(-this.width/2, this.height/2); ctx.closePath();
                ctx.shadowColor = c; ctx.shadowBlur = 15; ctx.fillStyle = c; ctx.fill();
                ctx.restore();
            }
            update() {
                if(this.blinkTimer > 0) this.blinkTimer--;
                this.x += this.velocity.x; this.y += this.velocity.y;
                if(this.x < 0) this.x = 0; if(this.x > canvas.width) this.x = canvas.width;
                if(this.y < 0) this.y = 0; if(this.y > canvas.height) this.y = canvas.height;
                this.draw();
            }
            hit() { this.blinkTimer = 40; }
        }

        class NumberBlock {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.isJoker = Math.random() < 0.1; 
                if (this.isJoker) {
                    this.value = -Math.floor(Math.random() * 9) - 1; 
                    this.color = '#a020f0'; 
                } else {
                    this.value = Math.floor(Math.random()*9)+1;
                    const colors = ['#fff','#ff5252','#ffeb3b','#4caf50','#2196f3','#9c27b0','#e040fb','#ff9800','#795548','#607d8b'];
                    this.color = colors[this.value];
                }
                this.width = 40; this.height = 40;
                const set = DIFFICULTY[currentMode];
                this.velocity = {x:0, y: set.speed + (level * set.accel)};
                this.radius = 20;
            }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y);
                ctx.beginPath();
                if (this.isJoker) {
                    ctx.roundRect(-20, -20, 40, 40, 10);
                    ctx.shadowBlur = 20; ctx.shadowColor = this.color;
                } else {
                    ctx.rect(-20, -20, 40, 40);
                }
                ctx.strokeStyle = this.color; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = '#fff'; ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(this.value, 0, 2);
                ctx.restore();
            }
            update() {
                this.y += this.velocity.y * timeScale;
                this.draw();
            }
        }

        class Projectile {
            constructor(x, y) {
                this.x = x; this.y = y; this.radius = 4;
                this.velocity = {x:0, y:-15}; this.color = '#ffcc00';
                this.dead = false;
            }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                ctx.fillStyle = this.color; ctx.fill();
            }
            update() {
                this.x += this.velocity.x * timeScale;
                this.y += this.velocity.y * timeScale;
                this.draw();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.v = {x: (Math.random()-0.5)*6, y: (Math.random()-0.5)*6};
                this.alpha = 1;
            }
            update() {
                this.x += this.v.x * timeScale; 
                this.y += this.v.y * timeScale;
                this.alpha -= 0.03 * timeScale;
                ctx.save(); ctx.globalAlpha = this.alpha;
                ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, Math.PI*2);
                ctx.fillStyle = this.color; ctx.fill(); ctx.restore();
            }
        }

        class Confetti {
            constructor(hueRange) {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height - canvas.height;
                const min = hueRange[0], max = hueRange[1];
                let h = Math.random() * (max - min) + min;
                if(h > 360) h -= 360;
                this.color = `hsl(${h}, 100%, 60%)`;
                this.size = Math.random()*10+5;
                this.v = {x: (Math.random()-0.5)*2, y: Math.random()*3+2};
                this.rot = Math.random()*360;
                this.rotSpd = (Math.random()-0.5)*5;
            }
            update() {
                this.y += this.v.y; this.x += Math.sin(this.y*0.01);
                this.rot += this.rotSpd;
                if(this.y > canvas.height) { this.y = -20; this.x = Math.random()*canvas.width; }
                
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rot*Math.PI/180);
                ctx.fillStyle = this.color; ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                ctx.restore();
            }
        }

        class Star {
            constructor() {
                this.x = Math.random()*canvas.width; this.y = Math.random()*canvas.height;
                this.r = Math.random()*1.5; this.v = Math.random()*2+0.5;
            }
            update() {
                this.y += this.v * timeScale;
                if(this.y > canvas.height) this.y = 0;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
                ctx.fillStyle = 'white'; ctx.fill();
            }
        }

        // ------------------ Main Logic ------------------

        function startGame(mode) {
            currentMode = mode;
            modeDisplay.innerText = `${DIFFICULTY[mode].name} MODE`;
            startScreen.classList.add('hidden');
            
            // 사운드 기본 켜기 (하이브리드 시스템 작동)
            if(!isSoundOn) toggleSound(); 
            init();
        }

        function togglePause() {
            if (!gameActive || isLevelClearing) return;
            isPaused = !isPaused;
            
            if (isPaused) {
                pauseScreen.style.display = 'flex';
                // 일시정지 시 음악도 멈춤
                bgmFile.pause();
                stopSynthBGM();
            } else {
                pauseScreen.style.display = 'none';
                // 재개 시 소리 상태에 따라 다시 켬
                if (isSoundOn) {
                    if (useSynth) startSynthBGM();
                    else bgmFile.play();
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'p' || e.key === 'P') togglePause();
        });

        function init() {
            player = new Player();
            projectiles = []; numbers = []; particles = []; confettiList = []; stars = [];
            currentSum = 0; level = 1; targetNum = 10;
            timeScale = 1.0; isLevelClearing = false;
            leakageSum = 0;
            startTime = Date.now();
            
            for(let i=0; i<50; i++) stars.push(new Star());
            
            updateUI();
            gameActive = true;
            isPaused = false;
            animate();
        }

        function updateUI() {
            targetEl.innerText = targetNum;
            currentEl.innerText = currentSum;
            hpEl.innerText = Math.max(0, player.hp);
            levelEl.innerText = `${level} / 10`;
            currentEl.style.color = (currentSum > targetNum*0.8) ? '#ff9800' : '#ffeb3b';
            
            const limit = DIFFICULTY[currentMode].limit;
            leakageEl.innerText = leakageSum;
            limitEl.innerText = limit;
            
            if (leakageSum >= limit * 0.8) leakageEl.style.color = 'red';
            else leakageEl.style.color = '#ff5555';
        }

        function spawnNumber() {
            if(isLevelClearing) return;
            let rate = (currentMode === 'easy') ? 80 : (currentMode === 'hard' ? 40 : 60);
            if(frames % rate === 0) {
                numbers.push(new NumberBlock(Math.random()*(canvas.width-40)+20, -50));
            }
        }

        function checkHit() {
            if(!isLevelClearing) {
                numbers.forEach((n, ni) => {
                    const dist = Math.hypot(player.x - n.x, player.y - n.y);
                    if(dist < player.radius + n.radius) {
                        player.hp -= 20; player.hit(); updateUI();
                        for(let k=0; k<10; k++) particles.push(new Particle(player.x, player.y, 'red'));
                        numbers.splice(ni, 1);
                        if(player.hp <= 0) gameOver("HP 소진");
                    }
                });
            }

            projectiles.forEach((p, pi) => {
                if(p.dead) return;
                numbers.forEach((n, ni) => {
                    if(p.dead) return; 
                    const dist = Math.hypot(p.x - n.x, p.y - n.y);
                    if(dist < p.radius + n.radius) {
                        p.dead = true;
                        
                        if (n.isJoker) {
                            for(let k=0; k<10; k++) particles.push(new Particle(n.x, n.y, '#a020f0'));
                            currentSum = Math.max(0, currentSum + n.value); 
                            showMessage(`${n.value} (MINUS!)`, '#a020f0');
                            updateUI();
                        } else {
                            for(let k=0; k<8; k++) particles.push(new Particle(n.x, n.y, n.color));
                            handleScore(n.value);
                        }
                        numbers.splice(ni, 1);
                    }
                });
            });
            
            projectiles = projectiles.filter(p => !p.dead && p.y > 0);
            
            for (let i = numbers.length - 1; i >= 0; i--) {
                const n = numbers[i];
                if (n.y > canvas.height + 50) {
                    if (!n.isJoker) { 
                        leakageSum += n.value;
                        updateUI();
                        if (leakageSum >= DIFFICULTY[currentMode].limit) {
                            gameOver("너무 많은 숫자를 놓침!");
                        }
                    }
                    numbers.splice(i, 1);
                }
            }
        }

        function handleScore(val) {
            if(isLevelClearing) return; 

            if(currentSum + val === targetNum) {
                currentSum += val;
                updateUI();
                
                if(targetNum >= 100) {
                    doGameClear();
                } else {
                    doLevelUp();
                }
            } else if (currentSum + val > targetNum) {
                currentSum = 0; 
                updateUI();
                showMessage("BUSTED! RESET", '#ff0055');
            } else {
                currentSum += val;
                updateUI();
            }
        }

        function doLevelUp() {
            isLevelClearing = true;
            timeScale = 0.1; 
            level++; targetNum += 10; currentSum = 0; updateUI();
            
            for(let i=0; i<30; i++) particles.push(new Particle(canvas.width/2, canvas.height/2, 'white'));
            numbers = []; projectiles = [];

            let count = 5;
            const overlay = document.getElementById('countdown-overlay');
            function tick() {
                if(count > 0) {
                    overlay.innerHTML = `<div class="countdown-number">${count}</div>`;
                    count--;
                    setTimeout(tick, 1000);
                } else {
                    overlay.innerHTML = `<div class="countdown-number" style="color:#00f260; font-size:8rem">START!</div>`;
                    setTimeout(() => {
                        overlay.innerHTML = '';
                        timeScale = 1.0; isLevelClearing = false;
                        showMessage(`LEVEL ${level} GO!`, '#00ffff');
                    }, 1000);
                }
            }
            tick();
        }

        function doGameClear() {
            isLevelClearing = true;
            timeScale = 0.1; 
            
            const finale = FINALE_CONFIG[currentMode] || FINALE_CONFIG['normal'];
            clearTitle.innerText = finale.title;
            clearTitle.className = `text-6xl font-black mb-4 drop-shadow-lg ${finale.colorClass}`;
            clearDesc.innerHTML = finale.desc;
            
            const endTime = Date.now();
            const totalSeconds = ((endTime - startTime) / 1000).toFixed(1);
            clearTime.innerText = `TOTAL TIME: ${totalSeconds}s`;
            
            // [중요] 피날레 화면 강제 표시
            clearScreen.style.display = 'flex';
            
            for(let i=0; i<150; i++) confettiList.push(new Confetti(finale.hue));
        }

        function gameOver(reason) {
            gameActive = false;
            failReason.innerText = `원인: ${reason}`;
            finalLevelEl.innerText = `${level} / 10`;
            gameOverScreen.classList.remove('hidden');
            
            bgmFile.pause();
            stopSynthBGM();
        }

        function showMessage(msg, color) {
            const el = document.getElementById('message-area');
            el.innerText = msg; el.style.color = color; el.style.opacity = 1;
            setTimeout(() => el.style.opacity = 0, 1500);
        }

        function animate() {
            if (!gameActive || isPaused) {
                if (gameActive && isPaused) requestAnimationFrame(animate);
                return;
            }
            
            requestAnimationFrame(animate);
            ctx.fillStyle = 'rgba(5, 5, 5, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => s.update());
            
            if(keys.ArrowRight && player.x < canvas.width-20) player.velocity.x = player.speed;
            else if(keys.ArrowLeft && player.x > 20) player.velocity.x = -player.speed;
            else player.velocity.x = 0;
            if(keys.ArrowUp && player.y > player.height) player.velocity.y = -player.speed;
            else if(keys.ArrowDown && player.y < canvas.height-player.height) player.velocity.y = player.speed;
            else player.velocity.y = 0;
            
            player.update();
            particles = particles.filter(p => p.alpha > 0);
            particles.forEach(p => p.update());
            confettiList.forEach(c => c.update());
            projectiles.forEach(p => p.update());
            numbers.forEach(n => n.update());
            checkHit();
            spawnNumber();
            frames++;
        }

        window.addEventListener('keydown', e => {
            if(e.code === 'Space') { if(gameActive && !isPaused) projectiles.push(new Projectile(player.x, player.y-20)); keys.Space = true; }
            if(keys.hasOwnProperty(e.code)) keys[e.code] = true;
        });
        window.addEventListener('keyup', e => {
            if(e.code === 'Space') keys.Space = false;
            if(keys.hasOwnProperty(e.code)) keys[e.code] = false;
        });
        window.addEventListener('touchstart', (e) => {
             if(gameActive && !isPaused) { player.x = e.touches[0].clientX; projectiles.push(new Projectile(player.x, player.y-20)); }
        });
        window.addEventListener('touchmove', (e) => {
            if(gameActive && !isPaused) { e.preventDefault(); player.x = e.touches[0].clientX; }
        }, {passive: false});

        document.getElementById('restartBtn').addEventListener('click', () => {
            gameOverScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        });
        document.getElementById('finalRestartBtn').addEventListener('click', () => {
            clearScreen.style.display = 'none';
            startScreen.classList.remove('hidden');
        });
    </script>
</body>
</html>
